name: Update prices

on:
  schedule:
    # 平日 16:30 JST。東証の終了後に、上場全銘柄の日足を取る。
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch JPX daily prices
        id: fetch
        run: python -m stockrec jpx --workers 4 --days 20
        continue-on-error: true

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jpx
          if git diff --cached --quiet; then
            echo "価格に変化はないため、コミットしません"
            exit 0
          fi
          git commit -m "Update JPX daily prices"
          git push

      - name: Fail if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
