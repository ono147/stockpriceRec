[project]
name = "stockrec"
version = "0.1.0"
description = "Yahooファイナンスの株価を手元のSQLiteに蓄積する"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stockrec = "stockrec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stockrec*"]
